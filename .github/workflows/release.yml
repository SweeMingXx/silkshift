name: Verify SILKSHIFT and promote release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: silkshift-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore test dependencies
        run: npm install --no-audit --no-fund
      - name: Check source syntax
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: |
          python3 -m http.server 8080 > /tmp/silkshift-http.log 2>&1 &
          for i in {1..15}; do curl -fsS http://127.0.0.1:8080/ > /dev/null && break || sleep 1; done
          npm test
      - name: Publish QA report and previews
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const p='test-results/report.json';
            const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
            const rows=r?r.results.map(t=>`${t.passed?'✅':'❌'} ${t.name}${t.error?'\n```\n'+t.error.slice(0,2200)+'\n```':''}`).join('\n'):'Tests did not reach reporting; inspect workflow logs.';
            for(const name of ['desktop-home.jpg','mobile-home.jpg','mobile-run.jpg']){
              if(!fs.existsSync('test-results/'+name))continue;
              let sha;try{sha=(await github.rest.repos.getContent({...context.repo,path:'previews/'+name,ref:'visual-qa'})).data.sha;}catch(e){if(e.status!==404)throw e;}
              await github.rest.repos.createOrUpdateFileContents({...context.repo,branch:'visual-qa',path:'previews/'+name,message:'Update visual QA: '+name,content:fs.readFileSync('test-results/'+name).toString('base64'),...(sha?{sha}:{})});
            }
            await github.rest.issues.createComment({...context.repo,issue_number:1,body:`## Browser verification\nCommit: ${context.sha}\n${rows}\n\n[Workflow and screenshots](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: test-results
      - name: Promote verified files to approved gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const source=(await github.rest.git.getCommit({...context.repo,commit_sha:context.sha})).data;
            const ref=(await github.rest.git.getRef({...context.repo,ref:'heads/gh-pages'})).data;
            const commit=(await github.rest.git.createCommit({...context.repo,message:'Release verified SILKSHIFT '+context.sha,tree:source.tree.sha,parents:[ref.object.sha]})).data;
            await github.rest.git.updateRef({...context.repo,ref:'heads/gh-pages',sha:commit.sha,force:false});
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'pages.yml',ref:'gh-pages'});
