name: Final responsive scene polish
on:
  repository_dispatch:
    types: [polish-scene]
permissions:
  contents: write
  actions: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          source=p.read_text()
          edits=[
            ('[0,4,-16]','[7,4,-16]'),
            ('5.35+state.jump*.16,10.3]','5.35+state.jump*.16,innerWidth<680?14.5:10.3]'),
            ('jumpAge=0;slideAge=0;travel=0;','jumpAge=0;slideAge=0;row=0;travel=0;'),
            ('Math.min(.035,(now-lastTime)','Math.min(.1,(now-lastTime)'),
            ("if(state.mode==='running'){update(dt);", "if(state.mode==='running'){let remaining=dt;while(remaining>0&&state.mode==='running'){const step=Math.min(remaining,1/60);update(step);remaining-=step;}"),
            ("o.z>-.95&&o.oldZ<1.2&&Math.abs(o.x-state.x)<1.22", "o.z>-(o.kind==='truck'?2.65:.95)&&o.oldZ<(o.kind==='truck'?2.65:1.2)&&Math.abs(o.x-state.x)<1.22"),
            ("const hit=o.kind==='truck'||", "const hit=(o.kind==='truck'&&state.jump<3.3)||"),
            ("(o.kind==='gate'&&(state.slide<=0||state.jump>.05))", "(o.kind==='gate'&&state.slide<=0&&state.jump<3.7)"),
            ("if($('guide').open)return;if(e.key===", "if($('guide').open)return;if(e.key==='Tab'&&['paused','over'].includes(state.mode)){const panel=$(state.mode==='paused'?'pause-screen':'over-screen');const buttons=[...panel.querySelectorAll('button')];const i=buttons.indexOf(document.activeElement);e.preventDefault();buttons[(i+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus();return;}if(e.key==="),
            ("get gl(){return gl;}", "project(p){const v=viewProjection;const w=v[3]*p[0]+v[7]*p[1]+v[11]*p[2]+v[15];return[(v[0]*p[0]+v[4]*p[1]+v[8]*p[2]+v[12])/w,(v[1]*p[0]+v[5]*p[1]+v[9]*p[2]+v[13])/w];},get gl(){return gl;}")
          ]
          for before,after in edits:
            assert source.count(before)==1, f'Expected exactly one match: {before}'
            source=source.replace(before,after)
          p.write_text(source)
          p=Path('tests/browser.mjs');source=p.read_text()
          source=source.replace("await mp.screenshot({path:'test-results/mobile-home.png'});", "await mp.screenshot({path:'test-results/mobile-home.png'});await mp.screenshot({path:'test-results/mobile-home.jpg',quality:65});const hero=await mp.evaluate(()=>__silkshift.project([3,6,0]));assert.ok(hero[0]>-.9&&hero[0]<.95,'Menu hero stays in portrait frame');")
          source=source.replace("await mp.screenshot({path:'test-results/mobile-run.png'});", "await mp.screenshot({path:'test-results/mobile-run.png'});await mp.screenshot({path:'test-results/mobile-run.jpg',quality:65});await mp.evaluate(()=>{__silkshift.state.x=3.4;__silkshift.state.lane=1;__silkshift.state.jump=0;__silkshift.pause();});await mp.waitForTimeout(100);const p=await mp.evaluate(()=>__silkshift.project([3.4,1.5,0]));assert.ok(p[0]<.94,'Right lane hero stays in portrait frame');")
          p.write_text(source)
          p=Path('.github/workflows/release.yml');source=p.read_text();source=source.replace("['desktop-home.jpg','mobile-home.png','desktop-swing.png']", "['desktop-home.jpg','mobile-home.jpg','mobile-run.jpg','desktop-swing.png']");p.write_text(source)
          Path('.github/workflows/polish.yml').unlink()
          PY
          node --check game.js
          node --check tests/browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js tests/browser.mjs .github/workflows
          git commit -m 'Polish portrait cameras, accessible focus, accurate collisions and fixed-step simulation'
          git push origin main
      - name: Start full release verification
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'release.yml',ref:'main'});
